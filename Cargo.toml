[package]
name = "nfs5like"
version = "0.1.0"
edition = "2021"

[dependencies]
sdl3 = "0.20"
gl = "0.14"
env_logger = "0.11"
log = "0.4"
geo = "0.33.1"
quick-xml = "0.42.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
flate2 = "1.1.10"
rstar = "0.12.2"
osmpbf = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tempfile = "3.27.0"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
ureq = { version = "3", features = ["json"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras"] }
glam = "0.30"

# Keep development builds practical for city-scale geometry and spatial queries.
[profile.dev]
opt-level = 1
