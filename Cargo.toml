[package]
name = "nfs5like"
version = "0.1.0"
edition = "2021"

[dependencies]
sdl3 = "0.20"
gl = "0.14"
env_logger = "0.11"
log = "0.4"
geo = "0.33.1"
quick-xml = "0.42.0"
serde_json = "1.0.154"
flate2 = "1.1.10"
sha2 = "0.11.1"
rstar = "0.12.2"

# Keep development builds practical for city-scale geometry and spatial queries.
[profile.dev]
opt-level = 1
